<!doctype html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>VC Manager — Pro Workflow Demo</title><style>
:root{

  --success:#118a5d; --success-bg:#e8f7f1; --warning:#b77708; --warning-bg:#fff6df;
  --danger:#c53b45; --danger-bg:#fff0f1; --purple:#6b52c9; --purple-bg:#f1edff;

*{box-sizing:border-box} body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit} button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.muted{color:var(--muted)}
.shell{display:flex;min-height:100vh}.sidebar{width:250px;background:#0d1d32;color:#d6e1ef;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:20}
.brand{padding:22px 18px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;gap:12px;align-items:center}
.brand-mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#3f91ff,#2369d5);display:grid;place-items:center;color:white;font-weight:900;box-shadow:0 6px 20px rgba(35,105,213,.35)}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:.08em}.brand span{display:block;color:#8ea2ba;font-size:10px;margin-top:4px}
.side-scroll{overflow:auto;padding:16px 10px}.section-title{font-size:10px;letter-spacing:.12em;color:#71869f;padding:9px 10px 7px}
.nav-item{width:100%;border:0;background:transparent;color:#b9c7d8;padding:11px 12px;border-radius:10px;text-align:left;display:flex;align-items:center;gap:11px;font-size:13px;margin-bottom:4px}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}.nav-item.active{background:rgba(68,137,235,.16);color:#fff;box-shadow:inset 3px 0 0 #4b98ff}
.nav-ico{width:18px;text-align:center;opacity:.9}.side-bottom{margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.08)}
.secure{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:12px;padding:11px;display:flex;gap:9px;align-items:center;margin-bottom:10px}
.secure strong{display:block;color:#fff;font-size:11px}.secure span{display:block;color:#7e95ae;font-size:10px;margin-top:2px}
.logout{width:100%;background:transparent;border:0;color:#a9bbcf;text-align:left;padding:10px;border-radius:9px}.logout:hover{background:rgba(255,255,255,.05);color:#fff}
.main{margin-left:250px;width:calc(100% - 250px);min-width:0}.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:15}
.search{height:42px;width:min(470px,45vw);background:#f7f9fc;border:1px solid #e8edf3;border-radius:11px;display:flex;align-items:center;gap:9px;padding:0 12px;color:#7c8ca0}
.search input{border:0;outline:0;background:transparent;width:100%;color:var(--text)}.search kbd{font-size:10px;background:#fff;border:1px solid #e1e7ef;border-radius:6px;padding:3px 6px;color:#8b98a9}
.top-right{display:flex;align-items:center;gap:13px}.icon-btn{border:1px solid var(--line);background:#fff;width:38px;height:38px;border-radius:10px;color:#718096}.profile{display:flex;gap:9px;align-items:center}.avatar{width:36px;height:36px;border-radius:11px;background:#eaf2ff;color:#2466c6;display:grid;place-items:center;font-weight:800;font-size:13px}.profile b{font-size:12px;display:block}.profile span{font-size:10px;color:var(--muted)}
.content{padding:28px 30px 52px;max-width:1600px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.14em;color:#74869a;font-weight:800}.page-head h1{margin:6px 0 5px;font-size:28px;line-height:1.15}.page-head p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:750;font-size:12px;display:inline-flex;align-items:center;gap:7px}.btn:hover{border-color:#cfd8e3}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary-2)}.btn.soft{background:#eef5ff;border-color:#d9e7ff;color:#2466c6}.btn.danger{background:#fff;border-color:#f0ced1;color:var(--danger)}
.grid{display:grid;gap:16px}.kpi-grid{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:20px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.kpi{padding:16px;display:flex;justify-content:space-between;gap:10px}.kpi .label{font-size:11px;color:var(--muted);font-weight:650}.kpi strong{display:block;font-size:25px;margin-top:6px}.kpi .sub{font-size:10px;color:var(--muted);margin-top:3px}.kpi-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:#eef5ff;color:#2a73d6}.kpi.success .kpi-icon{background:var(--success-bg);color:var(--success)}.kpi.warning .kpi-icon{background:var(--warning-bg);color:var(--warning)}.kpi.danger .kpi-icon{background:var(--danger-bg);color:var(--danger)}.kpi.purple .kpi-icon{background:var(--purple-bg);color:var(--purple)}
.two-col{grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr)}.three-col{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:15px}.panel-head h2{font-size:15px;margin:4px 0 0}.panel-head .link{font-size:11px;color:var(--primary);font-weight:800;cursor:pointer}
.queue-row{display:grid;grid-template-columns:1.2fr 1fr .8fr 110px 90px;gap:12px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}.queue-row:first-of-type{border-top:0}.cell-main b{font-size:12px}.cell-main span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap}.badge.success{color:var(--success);background:var(--success-bg)}.badge.warning{color:var(--warning);background:var(--warning-bg)}.badge.danger{color:var(--danger);background:var(--danger-bg)}.badge.info{color:#2466c6;background:#edf5ff}.badge.neutral{color:#67768a;background:#f2f4f7}
.timeline{position:relative;padding:3px 0}.timeline:before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:#edf0f4}.tl{position:relative;display:flex;gap:11px;padding:9px 0}.dot{width:24px;height:24px;border-radius:50%;background:#edf5ff;color:#2a73d6;display:grid;place-items:center;font-size:10px;border:3px solid #fff;box-shadow:0 0 0 1px #dce7f6;flex:none}.tl b{font-size:11px}.tl span{display:block;font-size:10px;color:var(--muted);margin-top:3px}
.lifecycle{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.life{padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:#fbfcfe;position:relative;text-align:center}.life:not(:last-child):after{content:"→";position:absolute;right:-11px;top:23px;color:#a9b7c7;font-weight:800;z-index:2}.life .num{width:26px;height:26px;border-radius:50%;background:#edf5ff;color:#2466c6;display:grid;place-items:center;margin:0 auto 7px;font-size:11px;font-weight:900}.life b{display:block;font-size:10px}.life span{display:block;color:#8a98aa;font-size:9px;margin-top:3px}
.empty{padding:46px 20px;text-align:center;color:var(--muted)}.empty .empty-icon{width:52px;height:52px;border-radius:14px;background:#f3f6fa;color:#8a99ab;display:grid;place-items:center;margin:0 auto 11px;font-size:22px}.empty b{display:block;color:var(--text);font-size:13px;margin-bottom:5px}.empty span{display:block;font-size:11px;line-height:1.5}.empty .btn{margin-top:14px}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 12px;outline:0;background:#fff;min-width:230px}.select{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;outline:0;background:#fff;color:var(--text)}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{font-size:10px;color:#8190a2;text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:12px 14px;background:#fbfcfe;border-bottom:1px solid var(--line)}.table td{font-size:11px;padding:13px 14px;border-bottom:1px solid #eef1f5;vertical-align:middle}.table tr:last-child td{border-bottom:0}.table tr:hover td{background:#fbfdff}.row-actions{display:flex;gap:6px}.mini-btn{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:8px;color:#68778b}
.detail-hero{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-bottom:18px}.identity{padding:20px;display:flex;gap:14px;align-items:flex-start}.identity-avatar{width:54px;height:54px;border-radius:15px;background:linear-gradient(135deg,#edf5ff,#e4efff);color:#2369d5;display:grid;place-items:center;font-weight:900;font-size:18px}.identity h2{margin:2px 0 3px;font-size:19px}.identity p{margin:0;color:var(--muted);font-size:11px}.identity .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.chip{padding:5px 8px;border-radius:8px;background:#f2f5f8;color:#637389;font-size:10px;font-weight:750}
.metric-strip{display:grid;grid-template-columns:repeat(3,1fr);padding:14px}.metric{padding:6px 12px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric span{display:block;color:var(--muted);font-size:10px}.metric strong{display:block;font-size:18px;margin-top:4px}
.modal-backdrop{position:fixed;inset:0;background:rgba(9,22,39,.47);display:grid;place-items:center;padding:20px;z-index:80}.modal{width:min(860px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.22)}.modal-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.modal-head h2{margin:4px 0 0;font-size:18px}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.wide{grid-column:1/-1}.field span{font-size:10px;color:#66768a;font-weight:800}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:0;background:#fff;color:var(--text);font-size:12px}.field small{font-size:9px;color:#8b98aa}.modal-actions{padding-top:18px;margin-top:18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.wizard-head{display:flex;gap:8px;padding:14px 20px;background:#fbfcfe;border-bottom:1px solid var(--line)}.step{flex:1;text-align:center;font-size:10px;font-weight:800;color:#8b99aa}.step.active{color:var(--primary)}.step .circle{width:25px;height:25px;border-radius:50%;margin:0 auto 6px;border:1px solid #dce3eb;display:grid;place-items:center;font-size:10px;background:#fff}.step.active .circle{background:#edf5ff;border-color:#cce0ff;color:var(--primary)}
.split{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.callout{padding:12px 13px;border-radius:11px;background:#f7faff;border:1px solid #dceaff;color:#58718d;font-size:11px;line-height:1.5}.callout b{color:#315a7e}.warning-box{background:#fff8e9;border-color:#f5dfae;color:#856014}
.toast{position:fixed;right:20px;bottom:20px;background:#122033;color:#fff;padding:12px 15px;border-radius:11px;box-shadow:0 12px 35px rgba(0,0,0,.2);font-size:11px;z-index:100;max-width:360px}
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;background:linear-gradient(135deg,#0d1d32 0%,#15385c 48%,#eef5ff 48%,#eef5ff 100%)}.login-left{padding:70px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}.login-left h1{font-size:52px;line-height:1.03;margin:0;max-width:620px}.login-left h1 em{font-style:normal;color:#7fb7ff}.login-left p{color:#c4d4e5;max-width:600px;line-height:1.65}.login-points{display:grid;gap:8px;color:#cbd9e8;font-size:11px}.login-right{display:grid;place-items:center;padding:40px}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 24px 80px rgba(15,32,55,.12)}.login-card h2{margin:7px 0 5px;font-size:24px}.login-card p{margin:0 0 22px;color:var(--muted);font-size:12px;line-height:1.5}.login-card .field{margin-bottom:13px}.login-submit{width:100%;border:0;background:var(--primary);color:#fff;padding:12px;border-radius:11px;font-weight:800;margin-top:6px}.login-demo{margin-top:14px;padding:10px;border:1px dashed #d7e0eb;background:#f8fafc;border-radius:10px;font-size:10px;color:#718096}
.chart{display:grid;gap:10px}.bar{display:grid;grid-template-columns:125px 1fr 42px;gap:9px;align-items:center;font-size:10px}.bar-track{height:8px;border-radius:999px;background:#edf1f6;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#5aa0f2,#2d74d4);border-radius:999px}
.responsive-hide{display:block}
@media(max-width:1150px){.kpi-grid{grid-template-columns:repeat(3,1fr)}.queue-row{grid-template-columns:1.2fr 1fr .8fr 100px}.queue-row .hide-md{display:none}.lifecycle{grid-template-columns:repeat(4,1fr)}.life:nth-child(4):after{display:none}.two-col{grid-template-columns:1fr}.detail-hero{grid-template-columns:1fr}}
@media(max-width:820px){.sidebar{width:74px}.brand{justify-content:center}.brand-copy,.side-bottom .secure div,.side-bottom .logout span,.section-title,.nav-item span{display:none}.nav-item{justify-content:center}.main{margin-left:74px;width:calc(100% - 74px)}.topbar{padding:0 14px}.search{width:42px}.search input,.search kbd{display:none}.content{padding:20px 14px}.kpi-grid{grid-template-columns:repeat(2,1fr)}.three-col,.split{grid-template-columns:1fr}.login{grid-template-columns:1fr;background:#f5f7fb}.login-left{display:none}.login-right{padding:20px}}
@media(max-width:560px){.page-head{align-items:flex-start;flex-direction:column}.kpi-grid{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.queue-row{grid-template-columns:1fr 100px}.queue-row .hide-sm{display:none}.lifecycle{grid-template-columns:repeat(2,1fr)}.life:after{display:none!important}.table th,.table td{white-space:nowrap}.modal-backdrop{padding:8px}.modal-body{padding:14px}}
</style></head><body><script>
const KEY="vc_pro_v2_data";
const AUTH="vc_pro_v2_auth";
const initial={customers:[],scales:[],vcids:[],certificates:[],renewals:[],payments:[],followups:[],invoices:[],activities:[]};
let state={...initial,...JSON.parse(localStorage.getItem(KEY)||"{}")};
let currentPage="dashboard"; let modalEl=null; let certWizardStep=1;
const $=s=>document.querySelector(s);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function resetAll(){if(confirm("Reset all demo business data? This cannot be undone.")){state={...initial,customers:[],scales:[],vcids:[],certificates:[],renewals:[],payments:[],followups:[],invoices:[],activities:[]};save();toast("All business data cleared");render()}}
function auth(){return localStorage.getItem(AUTH)==="1"}
function login(e){e.preventDefault();let f=new FormData(e.target);if(f.get("email").toLowerCase().trim()==="admin@vcmanagement.com" && f.get("password")==="admin123"){localStorage.setItem(AUTH,"1");currentPage="dashboard";render()}else $("#login-error").textContent="Invalid email or password."}
function logout(){localStorage.removeItem(AUTH);render()}
function uid(p){return p+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,7)}
function toast(msg){let t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}
function nav(p){currentPage=p;render();scrollTo({top:0,behavior:"smooth"})}
function fmtDate(s){if(!s)return"—";let d=new Date(s+"T00:00:00");return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
function daysTo(s){return Math.ceil((new Date(s+"T00:00:00")-new Date())/86400000)}
function initials(name){return String(name||"").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase()||"VC"}
function customerByName(name){return state.customers.find(c=>c.name===name)}
function log(type,label,detail=""){state.activities.unshift({id:uid("act"),type,label,detail,at:new Date().toISOString()});state.activities=state.activities.slice(0,30);save()}
const ICON={dashboard:"⌂",customers:"◉",scales:"◫",certificates:"▣",renewals:"↻",followups:"☷",payments:"₹",invoices:"▤",reports:"◒",settings:"⚙",users:"●",stock:"▥"};
function icon(k){return `<span class="nav-ico">${ICON[k]||"•"}</span>`}

function loginPage(){
document.body.innerHTML=`<div class="login"><section class="login-left">
<div><div class="eyebrow" style="color:#9db5cf">VC MANAGER · PRO WORKFLOW</div><h1>Calibration records that stay <em>connected.</em></h1><p>Customer → Instrument → VCID → Certificate → Approval → Renewal → Billing. A single operational flow instead of disconnected screens.</p></div>
<div class="login-points"><span>✓ Due-date driven renewal workflow</span><span>✓ Certificate & instrument history in one place</span><span>✓ Searchable, audit-friendly operational records</span></div>
</section><section class="login-right"><div class="login-card">
<div class="eyebrow">SECURE ACCESS</div><h2>Welcome back</h2><p>Sign in to manage customer certificates, weighing instruments and renewals.</p>
<form onsubmit="login(event)"><label class="field"><span>Email address</span><input name="email" type="email" required autocomplete="username"></label><label class="field"><span>Password</span><input name="password" type="password" required autocomplete="current-password"></label><div id="login-error" style="color:var(--danger);font-size:10px;min-height:15px;margin:6px 0"></div><button class="login-submit">Sign in →</button></form>
<div class="login-demo">Demo login: <b>admin@vcmanagement.com</b> / <b>admin123</b></div></div></section></div>`
}

function sidebar(){
const items=[
["dashboard","Overview"],["customers","Customers"],["scales","Instruments"],["certificates","Certificates"],["renewals","Renewals"],["followups","Follow-ups"],["payments","Payments"],["invoices","Invoices"],["reports","Reports"]
];
return `<aside class="sidebar"><div class="brand"><div class="brand-mark">VC</div><div class="brand-copy"><b>VC MANAGER</b><span>Calibration Operations</span></div></div><div class="side-scroll"><div class="section-title">WORKSPACE</div>${items.map(([k,l])=>`<button class="nav-item ${currentPage===k?"active":""}" onclick="nav('${k}')">${icon(k)}<span>${l}</span></button>`).join("")}<div class="section-title" style="margin-top:8px">ADMINISTRATION</div><button class="nav-item ${currentPage==="users"?"active":""}" onclick="nav('users')">${icon("users")}<span>Users</span></button><button class="nav-item ${currentPage==="settings"?"active":""}" onclick="nav('settings')">${icon("settings")}<span>Settings</span></button></div><div class="side-bottom"><div class="secure"><div>✓</div><div><strong>Protected workspace</strong><span>Records persist until deleted</span></div></div><button class="logout" onclick="logout()">↩ <span>Sign out</span></button></div></aside>`
}
function topbar(){
return `<header class="topbar"><div class="search">${icon("reports")}<input oninput="globalSearch(this.value)" placeholder="Search customers, certificates, instruments..."><kbd>Ctrl K</kbd></div><div class="top-right"><button class="icon-btn" onclick="nav('renewals')" title="Renewals">${icon("renewals")}</button><div class="profile"><div class="avatar">AD</div><div><b>Admin</b><span>Administrator</span></div></div></div></header>`
}
function appShell(content){return `<div class="shell">${sidebar()}<div class="main">${topbar()}<main class="content">${content}</main></div></div>`}

function dashboard(){
const due=state.certificates.filter(c=>{let d=daysTo(c.expiry);return d>=0&&d<=30}).sort((a,b)=>a.expiry.localeCompare(b.expiry));
const overdue=state.certificates.filter(c=>daysTo(c.expiry)<0);
const active=state.certificates.filter(c=>daysTo(c.expiry)>=0);
const pending=state.renewals.filter(r=>["Pending","Contacted"].includes(r.status));
const paid=state.payments.filter(p=>p.status==="Paid").reduce((s,p)=>s+Number(p.amount||0),0);
const counts=[["Active instruments",state.scales.length,"scales",""],["Due in 30 days",due.length,"renewals","warning"],["Overdue certificates",overdue.length,"certificates","danger"],["Pending renewals",pending.length,"renewals","purple"],["Collected","₹"+paid.toLocaleString("en-IN"),"payments","success"]];
return `<div class="page-head"><div><div class="eyebrow">OPERATIONS COMMAND CENTER</div><div style="display:flex;align-items:center;gap:9px"><h1>Good morning, Admin</h1><span class="badge success">● System ready</span></div><p>Run the full customer-to-certificate lifecycle from one workspace.</p></div><div class="actions"><button class="btn soft" onclick="openVcid()">＋ Add VCID Stock</button><button class="btn primary" onclick="openCertificateWizard()">＋ New Certificate</button></div></div>
<div class="grid kpi-grid">${counts.map(([l,v,i,cl])=>`<div class="card kpi ${cl}"><div><div class="label">${l}</div><strong>${v}</strong><div class="sub">${i==="scales"?"Registered instruments":i==="renewals"?"Action queue":"Live from your records"}</div></div><div class="kpi-icon">${icon(i)}</div></div>`).join("")}</div>
<div class="card panel" style="margin-bottom:16px"><div class="panel-head"><div><div class="eyebrow">CONTROLLED LIFECYCLE</div><h2>How the work flows</h2></div><div class="muted" style="font-size:10px">Every stage stays linked</div></div><div class="lifecycle">${["Customer","Instrument","VCID","Certificate","Review & Issue","Billing","Renewal"].map((x,i)=>`<div class="life"><div class="num">${i+1}</div><b>${x}</b><span>${["Owner record","Scale / asset","Stock allocation","Dates + result","Controlled output","Collection","Recall cycle"][i]}</span></div>`).join("")}</div></div>
<div class="grid two-col">
<section class="card panel"><div class="panel-head"><div><div class="eyebrow">WORK QUEUE</div><h2>What needs attention</h2></div><span class="link" onclick="nav('renewals')">Open renewals →</span></div>
${due.length||overdue.length?([...overdue.slice(0,4).map(c=>({...c,_state:"Overdue"})),...due.slice(0,4).map(c=>({...c,_state:daysTo(c.expiry)<=7?"Due this week":"Due soon"}))]).slice(0,6).map(c=>`<div class="queue-row"><div class="cell-main"><b>${c.customer}</b><span>${c.certificate} · ${c.vcid}</span></div><div class="cell-main"><b>${c.scaleId||"Instrument not set"}</b><span>Expiry ${fmtDate(c.expiry)}</span></div><div>${c._state==="Overdue"?'<span class="badge danger">Overdue</span>':'<span class="badge warning">'+c._state+'</span>'}</div><div class="hide-md">${daysTo(c.expiry)<0?Math.abs(daysTo(c.expiry))+"d late":daysTo(c.expiry)+"d left"}</div><button class="btn" onclick="openCertificateDetails('${c.id}')">View</button></div>`).join(""):`<div class="empty"><div class="empty-icon">✓</div><b>No work is waiting yet</b><span>Start with a customer. Then add an instrument, VCID and certificate. Your work queue will fill automatically.</span><button class="btn primary" onclick="openCustomer()">Create first customer</button></div>`}
</section>
<section class="card panel"><div class="panel-head"><div><div class="eyebrow">RECENT ACTIVITY</div><h2>Traceable history</h2></div><span class="link" onclick="nav('reports')">View reports →</span></div>
<div class="timeline">${state.activities.slice(0,6).map(a=>`<div class="tl"><div class="dot">✓</div><div><b>${a.label}</b><span>${a.detail||""} · ${new Date(a.at).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</span></div></div>`).join("")||`<div class="empty" style="padding:26px 10px"><div class="empty-icon">⌁</div><b>Activity history will appear here</b><span>Creates, certificate issues, payments and renewal actions will be tracked.</span></div>`}</div>
</section></div>`
}

function pageHeader(ey, title, desc, actions=""){return `<div class="page-head"><div><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function toolbar(resource, placeholder){return `<div class="toolbar"><div class="filters"><input class="input" id="${resource}-q" placeholder="${placeholder}" oninput="filterTable('${resource}')"><select class="select" id="${resource}-status" onchange="filterTable('${resource}')"><option value="">All status</option><option>Active</option><option>Pending</option><option>Issued</option><option>Used</option><option>Available</option><option>Overdue</option></select></div><span class="muted" style="font-size:10px">${state[resource].length} records</span></div>`}
function filterValue(resource, row){return Object.values(row).join(" ").toLowerCase()}
function filterTable(resource){let q=(document.getElementById(resource+"-q")?.value||"").toLowerCase(), st=document.getElementById(resource+"-status")?.value||"";document.querySelectorAll(`[data-row="${resource}"]`).forEach(el=>{let hit=el.dataset.search.includes(q), ok=!st||el.dataset.status===st;el.style.display=hit&&ok?"":"none"})}

function customersPage(){
return pageHeader("CUSTOMER DIRECTORY","Customers","Customer master data is the anchor for every certificate and renewal.",`<button class="btn primary" onclick="openCustomer()">＋ Add customer</button>`) + toolbar("customers","Search by name, mobile, email...") + `<div class="card table-wrap"><table class="table"><thead><tr><th>Customer</th><th>Contacts</th><th>Instruments</th><th>Certificates</th><th>Renewals</th><th>Status</th><th></th></tr></thead><tbody>${state.customers.length?state.customers.map(c=>{let n=state.scales.filter(s=>s.customer===c.name).length,cert=state.certificates.filter(x=>x.customer===c.name).length,ren=state.renewals.filter(x=>x.customer===c.name).length;return `<tr data-row="customers" data-search="${filterValue("customers",c).toLowerCase()}" data-status="Active"><td><b>${c.name}</b><span class="muted" style="display:block;font-size:9px;margin-top:2px">${c.company||"Independent customer"}</span></td><td>${c.mobile||"—"}<span class="muted" style="display:block;font-size:9px">${c.email||""}</span></td><td>${n}</td><td>${cert}</td><td>${ren}</td><td><span class="badge success">Active</span></td><td><button class="mini-btn" onclick="customerDrawer('${c.id}')">Open</button></td></tr>`}).join(""):`<tr><td colspan="7">${emptyHTML("No customers yet","Create your first customer. Every instrument, certificate and renewal will link back here.","openCustomer()","＋ Add customer")}</td></tr>`}</tbody></table></div>`
}
function emptyHTML(title,desc,fn,label){return `<div class="empty"><div class="empty-icon">○</div><b>${title}</b><span>${desc}</span>${fn?`<button class="btn primary" onclick="${fn}">${label||"Create"}</button>`:""}</div>`}

function scalesPage(){
return pageHeader("INSTRUMENT REGISTER","Weighing Scales","Register instruments once. Certificates and renewals always point back to the same instrument.",`<button class="btn primary" onclick="openScale()">＋ Add instrument</button>`) + toolbar("scales","Search scale ID, name, customer...") + `<div class="card table-wrap"><table class="table"><thead><tr><th>Instrument</th><th>Customer</th><th>Specifications</th><th>Serial / Model</th><th>Status</th><th></th></tr></thead><tbody>${state.scales.length?state.scales.map(s=>`<tr data-row="scales" data-search="${filterValue("scales",s).toLowerCase()}" data-status="${s.status||"Active"}"><td><b>${s.scaleName}</b><span class="muted" style="display:block;font-size:9px">${s.scaleId}</span></td><td>${s.customer}</td><td>${s.capacity||"—"}<span class="muted" style="display:block;font-size:9px">${s.type||""}</span></td><td>${s.serial||"—"}<span class="muted" style="display:block;font-size:9px">${s.model||""}</span></td><td><span class="badge success">${s.status||"Active"}</span></td><td><button class="mini-btn" onclick="openScaleDetails('${s.id}')">Open</button></td></tr>`).join(""):`<tr><td colspan="6">${emptyHTML("No instruments yet","Create the instrument against an existing customer. The same instrument will be available when creating a certificate.","openScale()","＋ Add instrument")}</td></tr>`}</tbody></table></div>`
}
function vcidPage(){
const av=state.vcids.filter(v=>v.status==="Available").length, used=state.vcids.filter(v=>v.status==="Used").length;
return pageHeader("VCID INVENTORY","VCID Stock","Control certificate identifiers before they are consumed by a certificate.",`<button class="btn primary" onclick="openVcid()">＋ Add VCID stock</button>`) + `<div class="grid three-col" style="margin-bottom:16px"><div class="card kpi"><div><div class="label">Total stock</div><strong>${state.vcids.length}</strong></div><div class="kpi-icon">#</div></div><div class="card kpi success"><div><div class="label">Available</div><strong>${av}</strong></div><div class="kpi-icon">✓</div></div><div class="card kpi purple"><div><div class="label">Used</div><strong>${used}</strong></div><div class="kpi-icon">↗</div></div></div>
<div class="card table-wrap"><table class="table"><thead><tr><th>VCID</th><th>Created</th><th>Status</th><th>Used by</th></tr></thead><tbody>${state.vcids.length?state.vcids.map(v=>`<tr><td><b>${v.vcid}</b></td><td>${fmtDate(v.created||"")}</td><td><span class="badge ${v.status==="Available"?"success":"neutral"}">${v.status}</span></td><td>${v.usedBy||"—"}</td></tr>`).join(""):`<tr><td colspan="4">${emptyHTML("No VCID stock","Add a stock batch before creating certificates.","openVcid()","＋ Add VCID stock")}</td></tr>`}</tbody></table></div>`
}
function certificatesPage(){
return pageHeader("CERTIFICATE CONTROL","Certificates","A controlled certificate record connects customer, instrument, VCID, dates, issue status and renewal.",`<button class="btn soft" onclick="openVcid()">＋ Add VCID stock</button><button class="btn primary" onclick="openCertificateWizard()">＋ Create certificate</button>`) + toolbar("certificates","Search certificate, customer, VCID...") + `<div class="card table-wrap"><table class="table"><thead><tr><th>Certificate</th><th>Customer / Instrument</th><th>VCID</th><th>Certification</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody>${state.certificates.length?state.certificates.map(c=>{let d=daysTo(c.expiry);let bc=d<0?"danger":d<=30?"warning":"success";return `<tr data-row="certificates" data-search="${filterValue("certificates",c).toLowerCase()}" data-status="${c.status||"Issued"}"><td><b>${c.number}</b><span class="muted" style="display:block;font-size:9px">${c.type||"Verification Certificate"}</span></td><td><b>${c.customer}</b><span class="muted" style="display:block;font-size:9px">${c.scaleId||"Instrument"} · ${c.scaleName||""}</span></td><td>${c.vcid}</td><td>${fmtDate(c.certDate)}</td><td><b>${fmtDate(c.expiry)}</b><span class="muted" style="display:block;font-size:9px">${d<0?Math.abs(d)+" days overdue":d+" days remaining"}</span></td><td><span class="badge ${bc}">${d<0?"Expired":d<=30?"Due soon":"Issued"}</span></td><td><button class="mini-btn" onclick="openCertificateDetails('${c.id}')">Open</button></td></tr>`}).join(""):`<tr><td colspan="7">${emptyHTML("No certificates yet","Follow the controlled flow: Customer → Instrument → VCID → Certificate.","openCertificateWizard","＋ Create first certificate")}</td></tr>`}</tbody></table></div>`
}
function renewalsPage(){
const overdue=state.renewals.filter(r=>daysTo(r.expiry)<0), soon=state.renewals.filter(r=>daysTo(r.expiry)>=0&&daysTo(r.expiry)<=30), later=state.renewals.filter(r=>daysTo(r.expiry)>30);
return pageHeader("RENEWAL & RECALL","Renewals","The renewal queue is generated from certificate expiry dates, not entered separately.",`<button class="btn primary" onclick="nav('certificates')">Go to certificates</button>`) + `<div class="grid three-col" style="margin-bottom:16px"><div class="card kpi danger"><div><div class="label">Overdue</div><strong>${overdue.length}</strong></div><div class="kpi-icon">!</div></div><div class="card kpi warning"><div><div class="label">Due in 30 days</div><strong>${soon.length}</strong></div><div class="kpi-icon">↻</div></div><div class="card kpi success"><div><div class="label">Future queue</div><strong>${later.length}</strong></div><div class="kpi-icon">✓</div></div></div>
<div class="card panel"><div class="panel-head"><div><div class="eyebrow">ACTION QUEUE</div><h2>Recall / renewal work</h2></div><span class="muted" style="font-size:10px">${state.renewals.length} linked renewals</span></div>
${state.renewals.length?state.renewals.sort((a,b)=>a.expiry.localeCompare(b.expiry)).map(r=>{let d=daysTo(r.expiry);let cls=d<0?"danger":d<=30?"warning":"success";return `<div class="queue-row" style="grid-template-columns:1.2fr 1fr 140px 120px 110px"><div class="cell-main"><b>${r.customer}</b><span>${r.certificate}</span></div><div class="cell-main"><b>${fmtDate(r.expiry)}</b><span>Reminder: ${fmtDate(r.reminder)}</span></div><div><span class="badge ${cls}">${d<0?"Overdue":d===0?"Due today":d+" days left"}</span></div><div>${r.status||"Pending"}</div><div class="row-actions"><button class="btn" onclick="markRenewal('${r.id}')">Update</button></div></div>`}).join(""):emptyHTML("Renewal queue is empty","As soon as you issue a certificate with an expiry date, the recall record will be created automatically.")}
</div></div>`
}
function simpleListPage(title,ey,desc,resource,cols,openFn){
const rows=state[resource];
return pageHeader(ey,title,desc,openFn?`<button class="btn primary" onclick="${openFn}">＋ Add record</button>`:"") + `<div class="card table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${cols.map(c=>`<td>${c.render?c.render(r):r[c.key]||"—"}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${cols.length}">${emptyHTML("No records yet","Create records from the linked workflow so every entry stays connected.")}</td></tr>`}</tbody></table></div>`
}
function followupsPage(){return simpleListPage("Follow-ups","CUSTOMER OUTREACH","Track contact attempts and next actions against existing customers.","followups",[{label:"Customer",key:"customer"},{label:"Certificate",key:"certificate"},{label:"Contact date",key:"date"},{label:"Method",key:"method"},{label:"Status",key:"status"}],"openFollowup()")}
function paymentsPage(){return simpleListPage("Payments","COLLECTIONS","Track invoices, amounts and payment status against customers.","payments",[{label:"Customer",key:"customer"},{label:"Invoice",key:"invoice"},{label:"Amount",key:"amount",render:r=>"₹"+Number(r.amount||0).toLocaleString("en-IN")},{label:"Date",key:"date"},{label:"Method",key:"method"},{label:"Status",key:"status"}],"openPayment()")}
function invoicesPage(){return simpleListPage("Invoices","BILLING","Create invoices from the certificate/customer relationship and track collection.","invoices",[{label:"Invoice",key:"invoice"},{label:"Customer",key:"customer"},{label:"Date",key:"date"},{label:"Total",key:"total",render:r=>"₹"+Number(r.total||0).toLocaleString("en-IN")},{label:"Status",key:"status"}],"openInvoice()")}
function reportsPage(){
let issued=state.certificates.length, active=state.certificates.filter(c=>daysTo(c.expiry)>=0).length, overdue=state.certificates.filter(c=>daysTo(c.expiry)<0).length, available=state.vcids.filter(v=>v.status==="Available").length;
return pageHeader("REPORTING","Reports","Operational visibility for certificates, renewals, instruments and collections.","") + `<div class="grid three-col" style="margin-bottom:16px"><div class="card panel"><div class="eyebrow">CERTIFICATE HEALTH</div><h2 style="margin:5px 0 15px">${issued?Math.round(active/issued*100):0}% active</h2><div class="chart"><div class="bar"><span>Active</span><div class="bar-track"><div class="bar-fill" style="width:${issued?active/issued*100:0}%"></div></div><b>${active}</b></div><div class="bar"><span>Overdue</span><div class="bar-track"><div class="bar-fill" style="width:${issued?overdue/issued*100:0}%"></div></div><b>${overdue}</b></div></div></div><div class="card panel"><div class="eyebrow">VCID STOCK</div><h2 style="margin:5px 0 15px">${available} available</h2><p class="muted" style="font-size:11px">Keep enough identifiers available before certificate issue.</p></div><div class="card panel"><div class="eyebrow">AUDIT READINESS</div><h2 style="margin:5px 0 15px">${state.activities.length} events</h2><p class="muted" style="font-size:11px">Creation, issue, payment and renewal actions are captured as activity.</p></div></div><div class="card panel"><div class="panel-head"><div><div class="eyebrow">ACTIVITY EXPORT VIEW</div><h2>Recent events</h2></div></div>${state.activities.length?state.activities.slice(0,12).map(a=>`<div class="tl"><div class="dot">✓</div><div><b>${a.label}</b><span>${a.detail||""}</span></div></div>`).join(""):emptyHTML("No audit activity yet","Start creating business records and the activity feed will populate.")}</div>`
}
function usersPage(){return pageHeader("ADMINISTRATION","Users","Keep access roles separate from business records.","") + `<div class="card panel"><div class="identity"><div class="identity-avatar">AD</div><div><h2>Admin</h2><p>Administrator · Full workspace access</p><div class="chips"><span class="chip">Customers</span><span class="chip">Certificates</span><span class="chip">Billing</span><span class="chip">Reports</span></div></div></div></div>`}
function settingsPage(){return pageHeader("SYSTEM","Settings","Control notifications and reset the browser prototype.","") + `<div class="grid two-col"><div class="card panel"><div class="eyebrow">REMINDER POLICY</div><h2 style="margin:5px 0 16px">Recall window</h2><div class="field"><span>Primary reminder</span><select><option>1 day before expiry</option><option>7 days before expiry</option><option>30 days before expiry</option></select></div><div style="height:10px"></div><div class="field"><span>Escalation</span><select><option>Overdue → Follow-up queue</option><option>Overdue → Manager review</option></select></div></div><div class="card panel"><div class="eyebrow">DEMO DATA</div><h2 style="margin:5px 0 8px">Reset prototype</h2><p class="muted" style="font-size:11px;line-height:1.5">Clear all business records created in this browser. Login remains available.</p><button class="btn danger" onclick="resetAll()">Reset all business data</button></div></div>`}

function customerDrawer(id){
const c=state.customers.find(x=>x.id===id); if(!c)return;
let sc=state.scales.filter(x=>x.customer===c.name), cert=state.certificates.filter(x=>x.customer===c.name), ren=state.renewals.filter(x=>x.customer===c.name);
modal(`<div class="eyebrow">CUSTOMER 360</div><h2>${c.name}</h2>`,`<div class="modal-body"><div class="detail-hero"><div class="card identity"><div class="identity-avatar">${initials(c.name)}</div><div><h2>${c.name}</h2><p>${c.company||"Independent customer"}</p><div class="chips"><span class="chip">${c.mobile||"No mobile"}</span><span class="chip">${c.email||"No email"}</span></div></div></div><div class="card metric-strip"><div class="metric"><span>Instruments</span><strong>${sc.length}</strong></div><div class="metric"><span>Certificates</span><strong>${cert.length}</strong></div><div class="metric"><span>Renewals</span><strong>${ren.length}</strong></div></div></div><div class="grid two-col"><div class="card panel"><div class="eyebrow">INSTRUMENTS</div>${sc.length?sc.map(s=>`<div class="queue-row" style="grid-template-columns:1fr 100px"><div class="cell-main"><b>${s.scaleName}</b><span>${s.scaleId} · ${s.capacity||"Capacity n/a"}</span></div><span class="badge success">${s.status||"Active"}</span></div>`).join(""):emptyHTML("No instruments","Add a weighing scale for this customer.")}</div><div class="card panel"><div class="eyebrow">CERTIFICATES</div>${cert.length?cert.map(x=>`<div class="queue-row" style="grid-template-columns:1fr 100px"><div class="cell-main"><b>${x.number}</b><span>${x.scaleId||"—"} · ${fmtDate(x.expiry)}</span></div><span class="badge ${daysTo(x.expiry)<0?"danger":daysTo(x.expiry)<=30?"warning":"success"}">${daysTo(x.expiry)<0?"Expired":daysTo(x.expiry)<=30?"Due soon":"Active"}</span></div>`).join(""):emptyHTML("No certificates","Issue the first certificate for this customer.")}</div></div></div>`)
}

function modal(title,body){closeModal();document.body.insertAdjacentHTML("beforeend",`<div class="modal-backdrop" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><div>${title}</div><button class="icon-btn" onclick="closeModal()">×</button></div>${body}</div></div>`);modalEl=$("#modal")}
function closeModal(){document.getElementById("modal")?.remove();modalEl=null}

function openCustomer(){modal(`<div class="eyebrow">MASTER RECORD</div><h2>Create customer</h2>`,`<div class="modal-body"><form onsubmit="createCustomer(event)"><div class="form-grid"><label class="field"><span>Customer name</span><input name="name" required></label><label class="field"><span>Company / shop</span><input name="company"></label><label class="field"><span>Mobile</span><input name="mobile" required></label><label class="field"><span>WhatsApp</span><input name="whatsapp"></label><label class="field"><span>Email</span><input name="email" type="email"></label><label class="field"><span>Customer type</span><select name="type"><option>Business</option><option>Individual</option><option>Dealer</option></select></label><label class="field wide"><span>Address</span><textarea name="address" rows="3"></textarea></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save customer</button></div></form></div>`)}
function createCustomer(e){e.preventDefault();let f=new FormData(e.target);if(state.customers.some(c=>c.name.toLowerCase()===f.get("name").toLowerCase()))return toast("Customer already exists");let c={id:uid("cus"),name:f.get("name"),company:f.get("company"),mobile:f.get("mobile"),whatsapp:f.get("whatsapp"),email:f.get("email"),type:f.get("type"),address:f.get("address")};state.customers.unshift(c);log("customer","Customer created",`${c.name} added to the master register`);closeModal();render();toast("Customer created")}
function customerDatalist(id){return `<datalist id="${id}">${state.customers.map(c=>`<option value="${c.name}"></option>`).join("")}</datalist>`}
function openScale(){if(!state.customers.length)return toast("Create a customer first");modal(`<div class="eyebrow">INSTRUMENT REGISTER</div><h2>Add weighing scale</h2>`,`<div class="modal-body"><div class="callout"><b>Rule:</b> instruments cannot create customers. Select a customer that already exists.</div><div style="height:14px"></div><form onsubmit="createScale(event)"><div class="form-grid"><label class="field wide"><span>Existing customer</span><input name="customer" list="scaleCustomers" required>${customerDatalist("scaleCustomers")}<small>Search the customer by name.</small></label><label class="field"><span>Scale ID</span><input name="scaleId" required></label><label class="field"><span>Scale Name</span><input name="scaleName" required></label><label class="field"><span>Capacity</span><input name="capacity"></label><label class="field"><span>Type</span><select name="type"><option>Digital</option><option>Electronic</option><option>Mechanical</option></select></label><label class="field"><span>Make</span><input name="make"></label><label class="field"><span>Model</span><input name="model"></label><label class="field"><span>Serial number</span><input name="serial"></label><label class="field"><span>Status</span><select name="status"><option>Active</option><option>Inactive</option><option>Maintenance</option></select></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save instrument</button></div></form></div>`)}
function createScale(e){e.preventDefault();let f=new FormData(e.target);if(!customerByName(f.get("customer")))return toast("Select an existing customer");let s={id:uid("scale"),customer:f.get("customer"),scaleId:f.get("scaleId"),scaleName:f.get("scaleName"),capacity:f.get("capacity"),type:f.get("type"),make:f.get("make"),model:f.get("model"),serial:f.get("serial"),status:f.get("status")};state.scales.unshift(s);log("scale","Instrument registered",`${s.scaleName} linked to ${s.customer}`);closeModal();render();toast("Instrument registered")}
function openVcid(){modal(`<div class="eyebrow">VCID INVENTORY</div><h2>Add VCID stock</h2>`,`<div class="modal-body"><form onsubmit="createVcid(event)"><div class="form-grid"><label class="field"><span>VCID number</span><input name="vcid" required placeholder="VC-2026-0001"></label><label class="field"><span>Status</span><input value="Available" readonly></label><label class="field"><span>Batch / source</span><input name="batch"></label><label class="field"><span>Received date</span><input name="created" type="date"></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save stock</button></div></form></div>`)}
function createVcid(e){e.preventDefault();let f=new FormData(e.target);let v=f.get("vcid").trim();if(state.vcids.some(x=>x.vcid.toLowerCase()===v.toLowerCase()))return toast("VCID already exists");state.vcids.unshift({id:uid("vcid"),vcid:v,batch:f.get("batch"),created:f.get("created"),status:"Available"});log("vcid","VCID added",`${v} is now available for certificate issue`);closeModal();render();toast("VCID stock added")}
function openCertificateWizard(){if(!state.customers.length)return toast("Create a customer first");if(!state.scales.length)return toast("Create an instrument first");if(!state.vcids.some(v=>v.status==="Available"))return toast("Add an available VCID first");certWizardStep=1;renderWizard()}
function renderWizard(){let available=state.vcids.filter(v=>v.status==="Available");modal(`<div class="eyebrow">CONTROLLED ISSUE</div><h2>Create certificate</h2>`,`<div class="wizard-head">${["Customer & instrument","VCID","Certificate","Review & issue"].map((x,i)=>`<div class="step ${certWizardStep===i+1?"active":""}"><div class="circle">${i+1}</div>${x}</div>`).join("")}</div><div class="modal-body" id="wizardBody"></div>`);wizardBody(certWizardStep,available)}
function wizardBody(step,available){let body=$("#wizardBody");if(step===1){body.innerHTML=`<div class="callout"><b>Controlled link:</b> Certificate creation never creates a new customer or instrument. It selects existing master records.</div><div style="height:14px"></div><div class="form-grid"><label class="field"><span>Customer</span><input id="wizCustomer" list="wizCus" value="${sessionStorage.getItem("wizCustomer")||""}" onchange="saveWiz()">${customerDatalist("wizCus")}</label><label class="field"><span>Instrument</span><select id="wizScale" onchange="saveWiz()">${state.scales.map(s=>`<option value="${s.id}" ${sessionStorage.getItem("wizScale")===s.id?"selected":""}>${s.scaleId} — ${s.scaleName} · ${s.customer}</option>`).join("")}</select></label></div><div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="nextWizard(2)">Continue →</button></div>`}else if(step===2){body.innerHTML=`<div class="callout"><b>VCID control:</b> only stock marked <b>Available</b> can be consumed by an issued certificate.</div><div style="height:14px"></div><div class="form-grid"><label class="field"><span>Available VCID</span><select id="wizVcid">${available.map(v=>`<option>${v.vcid}</option>`).join("")}</select></label><label class="field"><span>Certificate type</span><select id="wizType"><option>Verification Certificate</option><option>Calibration Certificate</option><option>Re-Certification</option></select></label></div><div class="modal-actions"><button class="btn" onclick="nextWizard(1)">← Back</button><button class="btn primary" onclick="nextWizard(3)">Continue →</button></div>`}else if(step===3){body.innerHTML=`<div class="form-grid"><label class="field"><span>Certificate number</span><input id="wizNumber" placeholder="VC-CERT-0001"></label><label class="field"><span>Certification date</span><input id="wizCertDate" type="date"></label><label class="field"><span>Expiry date</span><input id="wizExpiry" type="date"></label><label class="field"><span>Service amount</span><input id="wizAmount" type="number" step="0.01"></label><label class="field wide"><span>Notes</span><textarea id="wizNotes" rows="3"></textarea></label></div><div class="modal-actions"><button class="btn" onclick="nextWizard(2)">← Back</button><button class="btn primary" onclick="nextWizard(4)">Review →</button></div>`}else{let c=state.customers.find(x=>x.name===sessionStorage.getItem("wizCustomer"));let s=state.scales.find(x=>x.id===sessionStorage.getItem("wizScale"));let v=$("#wizVcid")?.value||sessionStorage.getItem("wizVcid")||available[0]?.vcid||"";let num=sessionStorage.getItem("wizNumber")||"";body.innerHTML=`<div class="split"><div><div class="callout"><b>Customer</b><br>${c?.name||"—"} · ${c?.mobile||"no mobile"}</div><div style="height:10px"></div><div class="callout"><b>Instrument</b><br>${s?.scaleId||"—"} · ${s?.scaleName||"—"} · ${s?.capacity||"capacity n/a"}</div><div style="height:10px"></div><div class="callout"><b>VCID</b><br>${v||"—"}</div></div><div class="callout warning-box"><b>Issue checklist</b><br>✓ Existing customer selected<br>✓ Existing instrument selected<br>✓ Available VCID reserved<br>✓ Certification & expiry dates captured<br>✓ Renewal will be created automatically<br>✓ Customer contact will be used for recall</div></div><div class="modal-actions"><button class="btn" onclick="nextWizard(3)">← Back</button><button class="btn primary" onclick="issueCertificate('${v}')">Issue certificate</button></div>`}}
function saveWiz(){sessionStorage.setItem("wizCustomer",$("#wizCustomer")?.value||"");sessionStorage.setItem("wizScale",$("#wizScale")?.value||"")}
function nextWizard(step){certWizardStep=step; if(step>=3){if($("#wizVcid"))sessionStorage.setItem("wizVcid",$("#wizVcid").value); if($("#wizNumber"))sessionStorage.setItem("wizNumber",$("#wizNumber").value); if($("#wizCertDate"))sessionStorage.setItem("wizCertDate",$("#wizCertDate").value); if($("#wizExpiry"))sessionStorage.setItem("wizExpiry",$("#wizExpiry").value); if($("#wizAmount"))sessionStorage.setItem("wizAmount",$("#wizAmount").value); if($("#wizNotes"))sessionStorage.setItem("wizNotes",$("#wizNotes").value)}renderWizard()}
function issueCertificate(vcid){let customer=sessionStorage.getItem("wizCustomer"),scale=state.scales.find(s=>s.id===sessionStorage.getItem("wizScale"));let number=sessionStorage.getItem("wizNumber")||("VC-CERT-"+String(state.certificates.length+1).padStart(4,"0")),certDate=sessionStorage.getItem("wizCertDate")||new Date().toISOString().slice(0,10),expiry=sessionStorage.getItem("wizExpiry");if(!customer||!scale)return toast("Customer and instrument are required");if(!expiry)return toast("Expiry date is required");if(!state.vcids.find(v=>v.vcid===vcid&&v.status==="Available"))return toast("Selected VCID is no longer available");let cert={id:uid("cert"),number,customer,customerMobile:customerByName(customer)?.mobile||"",scaleId:scale.scaleId,scaleName:scale.scaleName,vcid,type:sessionStorage.getItem("wizType")||"Verification Certificate",certDate,expiry,amount:sessionStorage.getItem("wizAmount")||"",notes:sessionStorage.getItem("wizNotes")||"",status:"Issued"};state.certificates.unshift(cert);let stock=state.vcids.find(v=>v.vcid===vcid);stock.status="Used";stock.usedBy=number;stock.usedAt=new Date().toISOString();let d=new Date(expiry+"T00:00:00");d.setDate(d.getDate()-1);let cust=customerByName(customer)||{};state.renewals.unshift({id:uid("ren"),certificate:number,customer,expiry,reminder:d.toISOString().slice(0,10),mobile:cust.mobile||"",whatsapp:cust.whatsapp||"",email:cust.email||"",status:"Pending"});if(cert.amount)state.invoices.unshift({id:uid("inv"),invoice:"INV-"+String(state.invoices.length+1).padStart(4,"0"),customer,total:cert.amount,date:new Date().toISOString().slice(0,10),status:"Draft"});log("certificate","Certificate issued",`${number} issued to ${customer} · renewal ${d.toISOString().slice(0,10)}`);["wizCustomer","wizScale","wizVcid","wizNumber","wizCertDate","wizExpiry","wizAmount","wizNotes","wizType"].forEach(k=>sessionStorage.removeItem(k));closeModal();render();toast("Certificate issued and renewal created")}
function openCertificateDetails(id){let c=state.certificates.find(x=>x.id===id);if(!c)return;let d=daysTo(c.expiry);modal(`<div class="eyebrow">CERTIFICATE 360</div><h2>${c.number}</h2>`,`<div class="modal-body"><div class="detail-hero"><div class="card identity"><div class="identity-avatar">VC</div><div><h2>${c.customer}</h2><p>${c.scaleId||"Instrument"} · ${c.scaleName||""}</p><div class="chips"><span class="chip">${c.vcid}</span><span class="chip">${c.status}</span></div></div></div><div class="card metric-strip"><div class="metric"><span>Certification</span><strong>${fmtDate(c.certDate)}</strong></div><div class="metric"><span>Expiry</span><strong>${fmtDate(c.expiry)}</strong></div><div class="metric"><span>Due</span><strong>${d<0?Math.abs(d)+"d late":d+"d"}</strong></div></div></div><div class="callout ${d<=30?"warning-box":""}"><b>Renewal linkage:</b> Reminder ${fmtDate(state.renewals.find(r=>r.certificate===c.number)?.reminder)} · ${c.customerMobile||"No mobile saved"}.</div><div class="modal-actions"><button class="btn" onclick="closeModal()">Close</button><button class="btn primary" onclick="toast('PDF generation connected to the backend in the full project');">Download PDF</button></div></div>`) }
function openScaleDetails(id){let s=state.scales.find(x=>x.id===id);if(!s)return;modal(`<div class="eyebrow">INSTRUMENT</div><h2>${s.scaleName}</h2>`,`<div class="modal-body"><div class="grid two-col"><div class="card panel"><div class="eyebrow">ASSET</div><h2>${s.scaleId}</h2><p class="muted">${s.customer}</p><div class="chips" style="margin-top:10px"><span class="chip">${s.capacity||"Capacity n/a"}</span><span class="chip">${s.type||"Type n/a"}</span><span class="chip">${s.status||"Active"}</span></div></div><div class="card panel"><div class="eyebrow">CERTIFICATE HISTORY</div>${state.certificates.filter(c=>c.scaleId===s.scaleId).map(c=>`<div class="tl"><div class="dot">✓</div><div><b>${c.number}</b><span>Expiry ${fmtDate(c.expiry)}</span></div></div>`).join("")||emptyHTML("No certificates yet","This instrument is ready for its first certificate.")}</div></div></div>`) }
function markRenewal(id){let r=state.renewals.find(x=>x.id===id);if(!r)return;let next=r.status==="Pending"?"Contacted":r.status==="Contacted"?"Renewed":"Renewed";r.status=next;log("renewal","Renewal updated",`${r.certificate} → ${next}`);render();toast("Renewal updated")}
function openFollowup(){if(!state.customers.length)return toast("Create a customer first");let opts=state.customers.map(c=>`<option>${c.name}</option>`).join("");modal(`<div class="eyebrow">OUTREACH</div><h2>Add follow-up</h2>`,`<div class="modal-body"><form onsubmit="createFollowup(event)"><div class="form-grid"><label class="field"><span>Customer</span><select name="customer">${opts}</select></label><label class="field"><span>Certificate</span><input name="certificate"></label><label class="field"><span>Contact date</span><input name="date" type="date"></label><label class="field"><span>Method</span><select name="method"><option>Phone</option><option>WhatsApp</option><option>Email</option><option>Visit</option></select></label><label class="field"><span>Status</span><select name="status"><option>Pending</option><option>Completed</option><option>No response</option><option>Callback</option></select></label><label class="field wide"><span>Notes</span><textarea name="notes" rows="3"></textarea></label></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save follow-up</button></div></form></div>`)}
function createFollowup(e){e.preventDefault();let f=new FormData(e.target);state.followups.unshift({id:uid("fu"),customer:f.get("customer"),certificate:f.get("certificate"),date:f.get("date"),method:f.get("method"),status:f.get("status"),notes:f.get("notes")});log("followup","Follow-up added",`${f.get("customer")} · ${f.get("method")}`);closeModal();render();toast("Follow-up saved")}
function openPayment(){if(!state.customers.length)return toast("Create a customer first");let opts=state.customers.map(c=>`<option>${c.name}</option>`).join("");modal(`<div class="eyebrow">COLLECTIONS</div><h2>Record payment</h2>`,`<div class="modal-body"><form onsubmit="createPayment(event)"><div class="form-grid"><label class="field"><span>Customer</span><select name="customer">${opts}</select></label><label class="field"><span>Invoice</span><input name="invoice"></label><label class="field"><span>Amount</span><input name="amount" type="number" step="0.01"></label><label class="field"><span>Date</span><input name="date" type="date"></label><label class="field"><span>Method</span><select name="method"><option>UPI</option><option>Cash</option><option>Bank Transfer</option><option>Card</option><option>Cheque</option></select></label><label class="field"><span>Status</span><select name="status"><option>Paid</option><option>Pending</option><option>Partial</option></select></label></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save payment</button></div></form></div>`)}
function createPayment(e){e.preventDefault();let f=new FormData(e.target);state.payments.unshift({id:uid("pay"),customer:f.get("customer"),invoice:f.get("invoice"),amount:f.get("amount"),date:f.get("date"),method:f.get("method"),status:f.get("status")});log("payment","Payment recorded",`₹${Number(f.get("amount")||0).toLocaleString("en-IN")} · ${f.get("customer")}`);closeModal();render();toast("Payment recorded")}
function openInvoice(){if(!state.customers.length)return toast("Create a customer first");let opts=state.customers.map(c=>`<option>${c.name}</option>`).join("");modal(`<div class="eyebrow">BILLING</div><h2>Create invoice</h2>`,`<div class="modal-body"><form onsubmit="createInvoice(event)"><div class="form-grid"><label class="field"><span>Customer</span><select name="customer">${opts}</select></label><label class="field"><span>Invoice number</span><input name="invoice"></label><label class="field"><span>Date</span><input name="date" type="date"></label><label class="field"><span>Total</span><input name="total" type="number" step="0.01"></label><label class="field"><span>Status</span><select name="status"><option>Draft</option><option>Sent</option><option>Paid</option><option>Overdue</option></select></label></div><div class="modal-actions"><button class="btn" type="button" onclick="closeModal()">Cancel</button><button class="btn primary">Save invoice</button></div></form></div>`)}
function createInvoice(e){e.preventDefault();let f=new FormData(e.target);state.invoices.unshift({id:uid("inv"),customer:f.get("customer"),invoice:f.get("invoice"),date:f.get("date"),total:f.get("total"),status:f.get("status")});log("invoice","Invoice created",`${f.get("invoice")} · ${f.get("customer")}`);closeModal();render();toast("Invoice saved")}

function globalSearch(v){if(!v)return;let q=v.toLowerCase(),hit=state.customers.find(c=>c.name.toLowerCase().includes(q))||state.certificates.find(c=>`${c.number} ${c.customer}`.toLowerCase().includes(q));if(hit){page=state.customers.includes(hit)?"customers":"certificates";render();}}
function pageContent(){
switch(currentPage){
case"dashboard":return dashboard();case"customers":return customersPage();case"scales":return scalesPage();case"vcids":return vcidPage();case"certificates":return certificatesPage();case"renewals":return renewalsPage();case"followups":return followupsPage();case"payments":return paymentsPage();case"invoices":return invoicesPage();case"reports":return reportsPage();case"users":return usersPage();case"settings":return settingsPage();default:return dashboard()
}}
function render(){if(!auth()){loginPage();return}document.body.innerHTML=`<div class="app">${appShell(pageContent())}</div>`}
render();
</script></body></html>
